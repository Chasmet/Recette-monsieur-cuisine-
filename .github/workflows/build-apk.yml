name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Setup image generator
        run: python3 -m pip install --quiet pillow
      - name: Expand recipe catalogue
        run: python3 tools/expand_catalog.py
      - name: Remove duplicate recipes
        run: python3 tools/clean_duplicates.py
      - name: Enrich every generic recipe
        run: python3 tools/enrich_recipe_guidance.py
      - name: Prepare and import VRAC illustrations
        run: python3 tools/prepare_vrac.py
      - name: Generate missing PNG illustrations
        run: python3 tools/generate_recipe_illustrations.py
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build real debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Persist enriched catalogue and illustrations after successful build
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/recipes VRAC/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "Enrichit les recettes et illustrations [skip ci]"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git push origin HEAD:"${GITHUB_HEAD_REF}"
            else
              git push origin HEAD:main
            fi
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recette-Monsieur-Cuisine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
