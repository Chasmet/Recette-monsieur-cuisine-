name: Build Mime Copy APK

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Mime Copy project
        run: |
          base64 -d mime-copy-app.tar.gz.b64 > mime-copy-app.tar.gz
          tar -xzf mime-copy-app.tar.gz

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: mime-copy-app
        run: gradle wrapper --gradle-version 8.7

      - name: Make wrapper executable
        working-directory: mime-copy-app
        run: chmod +x gradlew

      - name: Build real debug APK
        working-directory: mime-copy-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mime-Copy-debug
          path: mime-copy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
