name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        if: ${{ hashFiles('tools/generate_project.py') != '' }}
        run: |
          python3 tools/generate_project.py
          rm -rf tools/payload tools/generate_project.py

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build real debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Persist compiled Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android recipe app [skip ci]"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recette-Monsieur-Cuisine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
